<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Phân Loại Rác Siêu Tốc</title>
    <!-- Tải Tailwind CSS để làm đẹp giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải React và ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Tải Babel để đọc hiểu mã lệnh React trực tiếp trên trình duyệt -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes bounce-short {
          0% { transform: scale(0.8) translateY(20px); opacity: 0; }
          50% { transform: scale(1.1) translateY(-10px); opacity: 1; }
          100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-bounce-short {
          animation: bounce-short 0.4s ease-out forwards;
        }
        @keyframes fade-in {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
          animation: fade-in 0.5s ease-out forwards;
        }
        
        /* Tùy chỉnh thanh cuộn cho đẹp mắt */
        .custom-scrollbar::-webkit-scrollbar {
          width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: #f1f5f9; 
          border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #cbd5e1; 
          border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const racThai = [
          { id: 1, name: 'Vỏ chuối', emoji: '🍌', type: 'hữu cơ', reason: 'Dễ phân hủy thành phân bón.' },
          { id: 2, name: 'Chai nhựa Lavie (sạch)', emoji: '🚰', type: 'tái chế', reason: 'Nhựa PET dễ dàng tái chế nếu sạch.' },
          { id: 3, name: 'Vỏ hộp sữa giấy', emoji: '🧃', type: 'nguy hại/khác', reason: 'Bẫy! Có lớp nhôm và nilon ép chặt, rất khó tái chế ở bãi rác thường.' },
          { id: 4, name: 'Báo cũ, thùng carton', emoji: '📰', type: 'tái chế', reason: 'Giấy có thể tái chế nhiều lần.' },
          { id: 5, name: 'Pin cũ, hỏng', emoji: '🔋', type: 'nguy hại/khác', reason: 'Chứa kim loại nặng (chì, thủy ngân), đầu độc đất và nước.' },
          { id: 6, name: 'Hộp xốp dính đồ ăn', emoji: '🥡', type: 'nguy hại/khác', reason: 'Xốp khó phân hủy và khi dính dầu mỡ thì không thể tái chế.' },
          { id: 7, name: 'Chai thủy tinh', emoji: '🍾', type: 'tái chế', reason: 'Thủy tinh có thể tái chế 100% không giới hạn.' },
          { id: 8, name: 'Bóng đèn huỳnh quang', emoji: '💡', type: 'nguy hại/khác', reason: 'Chứa hơi thủy ngân cực độc, cần xử lý riêng biệt.' },
          { id: 9, name: 'Túi nilon bẩn', emoji: '🛍️', type: 'nguy hại/khác', reason: 'Mất hàng trăm năm phân hủy, lẫn tạp chất khó tái chế.' },
          { id: 10, name: 'Lá cây khô', emoji: '🍂', type: 'hữu cơ', reason: 'Rác hữu cơ dễ phân hủy sinh học.' }
        ];

        function App() {
          const [gameState, setGameState] = useState('start'); 
          const [currentIndex, setCurrentIndex] = useState(0);
          const [feedback, setFeedback] = useState(null); // Các trạng thái: 'wrong', 'correct', 'explain', null

          const handleAnswer = (type) => {
            if (feedback === 'explain' || feedback === 'correct' || feedback === 'wrong') return;
            const isCorrect = racThai[currentIndex].type === type;
            if (isCorrect) {
              setFeedback('correct');
              setTimeout(() => setFeedback('explain'), 800); // Đợi 0.8s hiện tích xanh rồi chuyển sang bảng giải thích
            } else {
              setFeedback('wrong');
              setTimeout(() => setFeedback(null), 800); // Tắt dấu X để người chơi có thể chọn lại
            }
          };

          const nextItem = () => {
            setFeedback(null);
            if (currentIndex < racThai.length - 1) {
              setCurrentIndex(i => i + 1);
            } else {
              setGameState('end');
            }
          };

          const startGame = () => {
            setGameState('playing');
            setCurrentIndex(0);
            setFeedback(null);
          };

          const resetGame = () => {
            setGameState('start');
          };

          const TrashBins = () => (
            <div className="flex justify-center gap-4 md:gap-12 w-full mt-auto border-t-2 border-gray-200 pt-6">
              <div className="flex flex-col items-center cursor-pointer transition-transform hover:-translate-y-2 active:scale-95" onClick={() => handleAnswer('hữu cơ')}>
                <div className="w-24 h-32 md:w-32 md:h-40 bg-green-500 rounded-b-xl rounded-t-sm flex flex-col items-center justify-center text-white shadow-lg border-t-8 border-green-700 relative overflow-hidden">
                  <div className="absolute top-2 w-full flex justify-center opacity-30 text-5xl">🌿</div>
                  <span className="font-bold text-xl md:text-2xl z-10 mt-4">XANH</span>
                  <span className="text-sm font-medium z-10 text-center px-1">Hữu cơ</span>
                </div>
              </div>
              <div className="flex flex-col items-center cursor-pointer transition-transform hover:-translate-y-2 active:scale-95" onClick={() => handleAnswer('tái chế')}>
                <div className="w-24 h-32 md:w-32 md:h-40 bg-blue-500 rounded-b-xl rounded-t-sm flex flex-col items-center justify-center text-white shadow-lg border-t-8 border-blue-700 relative overflow-hidden">
                  <div className="absolute top-2 w-full flex justify-center opacity-30 text-5xl">♻️</div>
                  <span className="font-bold text-xl md:text-2xl z-10 mt-4">XANH D.</span>
                  <span className="text-sm font-medium z-10 text-center px-1">Tái chế</span>
                </div>
              </div>
              <div className="flex flex-col items-center cursor-pointer transition-transform hover:-translate-y-2 active:scale-95" onClick={() => handleAnswer('nguy hại/khác')}>
                <div className="w-24 h-32 md:w-32 md:h-40 bg-red-500 rounded-b-xl rounded-t-sm flex flex-col items-center justify-center text-white shadow-lg border-t-8 border-red-700 relative overflow-hidden">
                  <div className="absolute top-2 w-full flex justify-center opacity-30 text-5xl">⚠️</div>
                  <span className="font-bold text-xl md:text-2xl z-10 mt-4">ĐỎ</span>
                  <span className="text-sm font-medium z-10 text-center px-1">Nguy hại</span>
                </div>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              {/* Đã đổi aspect-ratio thành max-h/min-h để dễ cuộn hơn trên mọi màn hình */}
              <div className="w-full max-w-5xl h-[90vh] min-h-[600px] max-h-[850px] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-slate-200">
                
                {/* Thanh Header cố định */}
                <div className="h-16 bg-slate-800 text-white flex items-center justify-between px-6 shrink-0 z-10 shadow-sm">
                  <h1 className="text-xl md:text-2xl font-bold uppercase tracking-wider flex items-center gap-2">
                    🗑️ Phân Loại Rác Siêu Tốc
                  </h1>
                  <div className="text-sm font-medium bg-slate-700 px-3 py-1 rounded-full">
                    Game Tương Tác
                  </div>
                </div>

                {/* Khu vực Nội dung chính */}
                <div className="flex-1 flex flex-col relative overflow-hidden bg-white">
                  
                  {/* MÀN HÌNH BẮT ĐẦU */}
                  {gameState === 'start' && (
                    <div className="h-full flex flex-col items-center justify-center p-6 text-center animate-fade-in">
                      <div className="text-6xl mb-6">🌍♻️🗑️</div>
                      <h2 className="text-3xl md:text-4xl font-extrabold text-slate-800 mb-4">
                        Bạn Đã Sẵn Sàng Chưa?
                      </h2>
                      <p className="text-lg text-slate-600 max-w-2xl mx-auto mb-8">
                        Khi hình ảnh hiện lên, hãy suy nghĩ và <strong className="text-blue-600">bấm chọn</strong> vào thùng rác đúng: <br/> <strong className="text-green-600">XANH (Hữu cơ)</strong>, <strong className="text-blue-600">XANH DƯƠNG (Tái chế)</strong> hoặc <strong className="text-red-600">ĐỎ (Nguy hại)</strong>.
                      </p>
                      <button 
                        onClick={startGame}
                        className="flex items-center justify-center gap-2 bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-full text-xl font-bold transition-transform hover:scale-105 shadow-lg"
                      >
                        ▶ BẮT ĐẦU CHƠI
                      </button>
                    </div>
                  )}

                  {/* MÀN HÌNH CHƠI */}
                  {gameState === 'playing' && (
                    <div className="h-full flex flex-col items-center justify-between p-6 w-full">
                      <div className="w-full flex justify-center items-center px-4 md:px-8 mt-2">
                        <div className="text-xl font-bold text-slate-500 bg-slate-100 px-4 py-2 rounded-lg border border-slate-200">
                          Món: {currentIndex + 1} / {racThai.length}
                        </div>
                      </div>

                      <div key={currentIndex} className="flex flex-col items-center justify-center flex-1 animate-bounce-short relative w-full mt-4">
                        {(feedback === 'correct' || feedback === 'wrong') && (
                          <div className="absolute inset-0 flex items-center justify-center z-50 animate-fade-in">
                            {feedback === 'correct' && <div className="text-8xl md:text-9xl drop-shadow-lg">✅</div>}
                            {feedback === 'wrong' && <div className="text-8xl md:text-9xl drop-shadow-lg">❌</div>}
                          </div>
                        )}
                        <div className={`text-8xl md:text-[140px] drop-shadow-2xl mb-4 transition-transform duration-200 ${(feedback === 'correct' || feedback === 'wrong') ? 'opacity-30 blur-sm scale-90' : ''}`}>
                          {racThai[currentIndex].emoji}
                        </div>
                        <h2 className={`text-3xl md:text-5xl font-black text-slate-800 uppercase text-center tracking-tight px-4 ${(feedback === 'correct' || feedback === 'wrong') ? 'opacity-30' : ''}`}>
                          {racThai[currentIndex].name}
                        </h2>
                      </div>

                      {feedback === 'explain' ? (
                        <div className="flex flex-col items-center justify-center w-full mt-auto pt-4 animate-fade-in">
                           <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-6 mb-6 max-w-3xl text-center shadow-md">
                              <h3 className="text-xl md:text-2xl font-bold text-blue-800 mb-3">Giải thích:</h3>
                              <p className="text-lg md:text-xl text-slate-700 leading-relaxed">{racThai[currentIndex].reason}</p>
                           </div>
                           <button onClick={nextItem} className="bg-blue-500 hover:bg-blue-600 text-white px-10 py-4 rounded-full text-xl font-bold shadow-lg transition-transform hover:scale-105">
                             Tiếp theo ➡️
                           </button>
                        </div>
                      ) : (
                        <TrashBins />
                      )}
                    </div>
                  )}

                  {/* MÀN HÌNH KẾT QUẢ - Đã thêm thanh cuộn (overflow-y-auto custom-scrollbar) */}
                  {gameState === 'end' && (
                    <div className="h-full w-full flex flex-col animate-fade-in overflow-y-auto custom-scrollbar p-6">
                      <div className="text-center mb-8 shrink-0">
                        <h2 className="text-3xl md:text-4xl font-extrabold text-slate-800 mb-2 mt-4">TỔNG KẾT</h2>
                        <p className="text-slate-600 text-lg">Dưới đây là đáp án chuẩn xác. Hãy cuộn xuống để xem lại toàn bộ các món nhé!</p>
                      </div>
                      
                      {/* Bảng kết quả (Grid tự động co giãn) */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl mx-auto pb-8">
                        
                        {/* Cột Xanh */}
                        <div className="bg-green-50 border border-green-200 rounded-xl p-4 shadow-sm flex flex-col h-full">
                          <div className="bg-green-500 text-white font-bold text-center py-3 rounded-lg mb-4 text-lg">THÙNG XANH (Hữu Cơ)</div>
                          <ul className="space-y-3 flex-1">
                            {racThai.filter(r => r.type === 'hữu cơ').map(item => (
                              <li key={item.id} className="flex gap-4 bg-white p-4 rounded-lg border border-green-100 items-start">
                                <span className="text-3xl">{item.emoji}</span>
                                <div>
                                  <p className="font-bold text-slate-800 text-lg">{item.name}</p>
                                  <p className="text-sm text-slate-500 leading-snug mt-1">{item.reason}</p>
                                </div>
                              </li>
                            ))}
                          </ul>
                        </div>

                        {/* Cột Xanh Dương */}
                        <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 shadow-sm flex flex-col h-full">
                          <div className="bg-blue-500 text-white font-bold text-center py-3 rounded-lg mb-4 text-lg">THÙNG XANH D. (Tái Chế)</div>
                          <ul className="space-y-3 flex-1">
                            {racThai.filter(r => r.type === 'tái chế').map(item => (
                              <li key={item.id} className="flex gap-4 bg-white p-4 rounded-lg border border-blue-100 items-start">
                                <span className="text-3xl">{item.emoji}</span>
                                <div>
                                  <p className="font-bold text-slate-800 text-lg">{item.name}</p>
                                  <p className="text-sm text-slate-500 leading-snug mt-1">{item.reason}</p>
                                </div>
                              </li>
                            ))}
                          </ul>
                        </div>

                        {/* Cột Đỏ */}
                        <div className="bg-red-50 border border-red-200 rounded-xl p-4 shadow-sm flex flex-col h-full relative overflow-hidden">
                          <div className="bg-red-500 text-white font-bold text-center py-3 rounded-lg mb-4 text-lg flex justify-center items-center gap-2">
                            ⚠️ THÙNG ĐỎ (Nguy Hại)
                          </div>
                          <ul className="space-y-3 flex-1 relative z-10">
                            {racThai.filter(r => r.type === 'nguy hại/khác').map(item => (
                              <li key={item.id} className="flex gap-4 bg-white p-4 rounded-lg border border-red-100 shadow-sm relative items-start">
                                <span className="text-3xl">{item.emoji}</span>
                                <div>
                                  <p className="font-bold text-red-700 text-lg">{item.name}</p>
                                  <p className="text-sm text-slate-600 leading-snug mt-1">{item.reason}</p>
                                </div>
                              </li>
                            ))}
                          </ul>
                        </div>

                      </div>

                      {/* Nút chơi lại */}
                      <div className="text-center pb-8 pt-4 shrink-0">
                         <button 
                          onClick={resetGame}
                          className="inline-flex items-center justify-center gap-2 bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-3 rounded-full transition-colors font-bold text-lg"
                        >
                          🔄 Chơi lại từ đầu
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
